# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
#
# 位置说明：本文件必须位于仓库根的 .github/workflows/ 下，GitHub 才会调度。
# 原先它被放在 campus-overflow-student/.github/workflows/ci.yml（随课程模板整包导入），
# 该路径不在 GitHub 的识别范围内，导致流水线自建仓以来从未触发过一次。
#
# 路径说明：课程脚手架位于 campus-overflow-student/ 子目录，而模板中的命令按
# 「仓库根 = 脚手架根」编写，因此此处所有构建路径都加了 campus-overflow-student/ 前缀。
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]
  # 允许在 Actions 页面手动触发，便于验证流水线本身是否可用
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    # 集成测试所需真实依赖：由 job 级 service 容器提供 MySQL 与 Redis，
    # 端口映射与 CampusOverflowFlowIT 的默认连接参数保持一致（3307 / 6379）。
    # 之所以不再依赖 Testcontainers：用例已改为直连真实服务（T-063），
    # 避免测试进程内再拉起容器导致与 service 容器重复且启动更慢。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: campus_overflow_it
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: campus-overflow-student
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: campus-overflow-student/backend/pom.xml

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      # 必须带 -am：co-bootstrap 依赖 co-* 各上下文模块，只用 -pl 限定单模块时，
      # 这些 0.1.0-SNAPSHOT 构件只能从本地仓库解析。开发者本机因为跑过 install
      # 恰好能过，CI 全新环境则直接失败（Could not find artifact）。
      # 同时必须带 -Dsurefire.failIfNoSpecifiedTests=false：-am 连带构建的上游模块
      # 里没有 ArchitectureTest，surefire 3.x 默认会因「无匹配测试」失败。
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

      # 阶段 4：领域层覆盖率门禁（低于阈值直接失败）
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      # 阶段 5：集成测试（真实 MySQL 8.4 + Redis 7，由本 job 的 services 提供）
      # CampusOverflowFlowIT 已在 Sprint 3 / T-063 解除 @Disabled 并改为直连真实服务，
      # 默认连接 127.0.0.1:3307（MySQL）与 127.0.0.1:6379（Redis），与上方端口映射一致；
      # 需要换目标时用 -Dco.it.* 覆盖，避免改动测试代码。
      - name: 集成测试
        run: >-
          mvn -B -f backend/pom.xml verify -Dsurefire.skip=true
          -Dco.it.jdbc-url=jdbc:mysql://127.0.0.1:3307/campus_overflow_it
          -Dco.it.db-user=root
          -Dco.it.db-password=
          -Dco.it.redis-host=127.0.0.1
          -Dco.it.redis-port=6379

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "campus-overflow-student/**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 前端统一使用 pnpm：以 pnpm-lock.yaml 为准做可复现安装，
      # 安装完成后由 package.json 的 prepare 触发 husky，CI 只跑静态检查，不依赖本地钩子。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: campus-overflow-student/frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: campus-overflow-student/frontend
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile
      # 门禁 1：代码规范（含 @typescript-eslint/no-explicit-any，any 逃逸在此拦下）
      - name: 代码规范检查（ESLint）
        working-directory: campus-overflow-student/frontend
        run: pnpm lint
      # 门禁 2：格式一致性（Prettier，EditorConfig 约束缩进与换行）
      - name: 格式检查（Prettier）
        working-directory: campus-overflow-student/frontend
        run: pnpm format:check
      # 门禁 3：类型检查（tsc --noEmit，strict + noUncheckedIndexedAccess）
      - name: 类型检查
        working-directory: campus-overflow-student/frontend
        run: pnpm typecheck
      - name: 构建
        working-directory: campus-overflow-student/frontend
        run: pnpm build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f campus-overflow-student/deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} campus-overflow-student
      - name: 构建前端镜像
        run: docker build -f campus-overflow-student/deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} campus-overflow-student
